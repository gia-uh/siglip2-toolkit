site_name: siglip2-toolkit
site_description: Local-first SigLIP 2 embeddings, classification, export and retrieval.
site_url: https://uhgia.org/siglip2-toolkit/
repo_url: https://github.com/gia-uh/siglip2-toolkit
repo_name: gia-uh/siglip2-toolkit
edit_uri: edit/main/docs/
copyright: MIT — GIA-UH and Syalia S.R.L.

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            allow_inspection: false
            docstring_style: google
            filters: ["!^_"]
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_source: false
            show_root_heading: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Tutorial: tutorial.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Models: models.md
  - Library guide: library.md
  - CLI: cli.md
  - REST API: rest.md
  - Export format: formats.md
  - Recipes: recipes.md
  - API reference:
      - Overview: api/index.md
      - Embedder: api/embedder.md
      - Exporter: api/exporter.md
      - Models: api/models.md
      - Formats: api/formats.md
      - Retrieval: api/retrieval.md
      - Filters: api/filters.md
      - Classification: api/classification.md
      - Utilities: api/utils.md
  - Troubleshooting: troubleshooting.md
  - Development: development.md
  - Changelog: changelog.md
