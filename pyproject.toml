[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "siglip2-toolkit"
version = "0.0.4"
description = "Local-first toolkit around Google's SigLIP 2 models: text/image embeddings, zero-shot and fine-tuned classification, incremental corpus export and retrieval math. Library-first, with CLI and REST interfaces."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yudivián Almeida Cruz", email = "yudivian@gmail.com" },
]
keywords = [
    "siglip2",
    "embeddings",
    "image-search",
    "image-classification",
    "image-retrieval",
    "local-first",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "transformers>=4.51,<5",
    "huggingface_hub>=0.23",
    "Pillow>=10.0",
    "pillow-heif>=0.16",
    "PyYAML>=6.0",
    "tqdm>=4.60",
]

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "ruff>=0.6",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
siglip2 = "siglip2_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/gia-uh/siglip2-toolkit"
Repository = "https://github.com/gia-uh/siglip2-toolkit"
Issues = "https://github.com/gia-uh/siglip2-toolkit/issues"
Documentation = "https://uhgia.org/siglip2-toolkit/"

[tool.hatch.build.targets.wheel]
packages = ["src/siglip2_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires torch and a cached SigLIP 2 model; enabled with SIGLIP2_INTEGRATION=1",
]
