[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "siglip2-toolkit"
version = "0.0.1"
description = "Local-first toolkit around Google's SigLIP 2 models: text/image embeddings, incremental image indexing and retrieval primitives. Library-first, with CLI and REST interfaces."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yudivián Almeida Cruz", email = "yudivian@gmail.com" },
]
keywords = [
    "siglip2",
    "embeddings",
    "image-search",
    "image-indexing",
    "vector-search",
    "local-first",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "transformers>=4.51",
    "Pillow>=10.0",
    "pillow-heif>=0.16",
    "PyYAML>=6.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
siglip2 = "siglip2_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/gia-uh/siglip2-toolkit"
Repository = "https://github.com/gia-uh/siglip2-toolkit"
Issues = "https://github.com/gia-uh/siglip2-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/siglip2_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
