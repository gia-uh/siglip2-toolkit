name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Create environment (CPU torch)
        run: uv venv --python 3.12
      - name: Install
        run: uv pip install --python .venv/bin/python --torch-backend cpu -e ".[dev,server]"
      - name: Tests
        run: .venv/bin/python -m pytest -q
      - name: Build wheel
        run: uv build
