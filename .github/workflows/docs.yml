name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Create docs environment
        run: uv venv .venv-docs --python 3.12
      - name: Install docs toolchain
        run: uv pip install --python .venv-docs/bin/python mkdocs-material "mkdocstrings[python]" ruff
      - name: Build (strict)
        run: .venv-docs/bin/mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Enable GitHub Pages (source: GitHub Actions) and set the repository
    # variable DEPLOY_DOCS=true to publish on main.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_DOCS == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
